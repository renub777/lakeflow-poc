options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/cloud-builders/git'
    script: |
      #!/usr/bin/env bash

      set -e

      echo "Fetching git history..."

      git fetch --all || true
      git fetch --unshallow || true

      CURR_SHA=$(git rev-parse HEAD)

      echo "================================"
      echo "Current SHA : ${CURR_SHA}"
      echo "================================"

      PREV_SHA=$(gsutil cat gs://gcpcid-bucket02/state/last_commit.txt 2>/dev/null || echo "")

      echo "Previous SHA : ${PREV_SHA}"

      files=""

      if [ -n "${PREV_SHA}" ]; then

        echo "Checking previous commit..."

        if git rev-parse --verify "${PREV_SHA}^{commit}" >/dev/null 2>&1; then

          echo "Previous commit found"

          files=$(git diff --name-only "${PREV_SHA}" "${CURR_SHA}" || true)

        else

          echo "Previous commit still not found"
          echo "Using current commit files"

          files=$(git show --name-only --pretty="" HEAD)

        fi

      else

        echo "No previous build found"

        files=$(git show --name-only --pretty="" HEAD)

      fi

      echo "================================"
      echo "Changed Files"
      echo "================================"

      printf '%s\n' "${files}"

      if [ -z "${files}" ]; then

        echo "No changed files detected"

        echo "${CURR_SHA}" > /tmp/last_commit.txt

        gsutil cp /tmp/last_commit.txt \
          gs://gcpcid-bucket02/state/last_commit.txt

        exit 0

      fi

      echo "================================"
      echo "Uploading Changed Files"
      echo "================================"

      while IFS= read -r file; do

        if [ -z "${file}" ]; then
          continue
        fi

        if [ -f "${file}" ]; then

          echo "Uploading ${file}"

          gsutil cp "${file}" \
            "gs://gcpcid-bucket02/artifacts/${CURR_SHA}/${file}"

        else

          echo "Skipping ${file} (file not found)"

        fi

      done <<< "${files}"

      echo "${CURR_SHA}" > /tmp/last_commit.txt

      gsutil cp /tmp/last_commit.txt \
        gs://gcpcid-bucket02/state/last_commit.txt

      echo "================================"
      echo "Upload completed"
      echo "Artifact Path:"
      echo "gs://gcpcid-bucket02/artifacts/${CURR_SHA}/"
      echo "================================"
