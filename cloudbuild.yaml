steps:

# Step 1: Checkout repository
- name: 'gcr.io/cloud-builders/git'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
       echo "Checking out repository"
       git fetch --depth=2 origin

# Step 2: Get changed files
- name: 'ubuntu'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
       echo "Getting changed files"
       git diff --name-only HEAD~1 HEAD > changed_files.txt
       cat changed_files.txt

# Step 3: Copy changed files to deployment folder
- name: 'ubuntu'
 entrypoint: 'bash'
 args:
   - '-c'
   - |
     mkdir -p deploy_artifacts

     while read file; do
       if [ -f "$file" ]; then
         echo "Copying $file"
         mkdir -p deploy_artifacts/$(dirname "$file")
         cp "$file" "deploy_artifacts/$file"
       fi
     done < changed_files.txt

     echo "Artifacts prepared"
     find deploy_artifacts -type f

# Step 4: Install Databricks CLI
- name: 'python:3.11'
 entrypoint: 'bash'
 args:
   - '-c'
   - |
     pip install databricks-cli

# Step 5: Deploy changed notebooks
- name: 'python:3.11'
 entrypoint: 'bash'
 env:
   - 'DATABRICKS_HOST=${_DATABRICKS_HOST}'
   - 'DATABRICKS_TOKEN=${_DATABRICKS_TOKEN}'
 args:
   - '-c'
   - |
     echo "Deploying changed notebooks"

     if [ -d deploy_artifacts/notebooks ]; then
       echo "Notebook changes detected"
       # Example deployment command
       # databricks workspace import_dir deploy_artifacts/notebooks /Shared/notebooks --overwrite
     else
       echo "No notebook changes"
     fi

# Step 6: Deploy Lakeflow definitions
- name: 'python:3.11'
 entrypoint: 'bash'
 env:
   - 'DATABRICKS_HOST=${_DATABRICKS_HOST}'
   - 'DATABRICKS_TOKEN=${_DATABRICKS_TOKEN}'
 args:
   - '-c'
   - |
     echo "Deploying Lakeflow pipelines"

     if [ -d deploy_artifacts/lakeflow ]; then
       echo "Lakeflow changes detected"
       # Example deployment command
       # databricks bundle deploy -t dev
     else
       echo "No Lakeflow changes"
     fi

# Step 7: Completion
- name: 'ubuntu'
 entrypoint: 'bash'
 args:
   - '-c'
   - |
     echo "Cloud Build deployment completed successfully"
