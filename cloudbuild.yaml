options:
  logging: CLOUD_LOGGING_ONLY

steps:

# Step 1: Identify changed files
- name: 'gcr.io/cloud-builders/git'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      set -e

      ARTIFACT_DIR="/workspace/artifacts"
      mkdir -p "$$ARTIFACT_DIR"

      echo "Fetching Git history..."
      git fetch --unshallow || true
      git fetch --all || true

      CURR_SHA=$$(git rev-parse HEAD)
      echo "Current SHA: $$CURR_SHA"

      PREV_SHA=$$(gsutil cat gs://gcpcicd-bucket01/state/last_commit.txt 2>/dev/null || echo "")

      echo "Previous SHA: $$PREV_SHA"

      if [ -n "$$PREV_SHA" ]; then

        if ! git cat-file -e "$$PREV_SHA^{commit}" 2>/dev/null; then
          echo "Previous commit not found locally."
          touch /workspace/no_changes
          exit 0
        fi

        echo "Finding changed files..."

        files=$$(git diff --name-only "$$PREV_SHA" "$$CURR_SHA")

        if [ -z "$$files" ]; then
          echo "No changes found."
          touch /workspace/no_changes
          exit 0
        fi

      else
        echo "No previous build state found."

        files=$$(git diff-tree --no-commit-id --name-only -r HEAD)

        if [ -z "$$files" ]; then
          echo "No files changed."
          touch /workspace/no_changes
          exit 0
        fi
      fi

      echo "Changed files:"
      echo "$$files"

      while read -r file; do
        [ -z "$$file" ] && continue

        if [ -e "$
