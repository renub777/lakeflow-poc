options:
  logging: CLOUD_LOGGING_ONLY

steps:

- name: 'gcr.io/cloud-builders/git'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      set -e

      ARTIFACT_DIR="/workspace/artifacts"
      mkdir -p "$$ARTIFACT_DIR"

      CURR_SHA=$$(git rev-parse HEAD)
      echo "Current SHA: $$CURR_SHA"

      PREV_SHA=$$(gsutil cat gs://gcpcicd-bucket01/state/last_commit.txt 2>/dev/null || echo "")

      echo "Previous SHA: $$PREV_SHA"

      if [ -n "$$PREV_SHA" ]; then
        echo "Comparing commits..."

        files=$$(git diff --name-only "$$PREV_SHA" "$$CURR_SHA" || true)

        if [ -z "$$files" ]; then
          echo "No changed files found."
          touch /workspace/no_changes
          exit 0
        fi
      else
        echo "First build."

        files=$$(git ls-files)

        if [ -z "$$files" ]; then
          echo "Repository is empty."
          touch /workspace/no_changes
          exit 0
        fi
      fi

      echo "Changed files:"
      echo "$$files"

      while read -r file; do

        [ -z "$$file" ] && continue

        if [ -f "$$file" ]; then

          DIRNAME=$$(dirname "$$file")

          mkdir -p "$$ARTIFACT_DIR/$$DIRNAME"

          cp "$$file" "$$ARTIFACT_DIR/$$file"

          echo "Copied: $$file"

        fi

      done <<< "$$files"

      echo "$$CURR_SHA" > /workspace/current_commit.txt

      echo "Artifact contents:"
      find "$$ARTIFACT_DIR"

- name: 'gcr.io/cloud-builders/gsutil'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      if [ -f /workspace/no_changes ]; then
        echo "No changes detected."
        exit 0
      fi

      FILE_COUNT=$$(find /workspace/artifacts -type f | wc -l)

      echo "Artifact count: $$FILE_COUNT"

      if [ "$$FILE_COUNT" -gt 0 ]; then
        gsutil -m cp -r /workspace/artifacts/* \
          gs://gcpcicd-bucket01/build-artifacts/$BUILD_ID/
      fi

      gsutil cp \
        /workspace/current_commit.txt \
        gs://gcpcicd-bucket01/state/last_commit.txt

timeout: '1200s'
