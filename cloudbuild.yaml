options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/cloud-builders/git'
    script: |
      #!/usr/bin/env bash

      set -e

      ARTIFACT_DIR="/workspace/artifacts"
      mkdir -p "${ARTIFACT_DIR}"

      CURR_SHA=$(git rev-parse HEAD)

      echo "================================"
      echo "Current SHA : ${CURR_SHA}"
      echo "================================"

      PREV_SHA=$(gsutil cat gs://gcpcicd-bucket02/state/last_commit.txt 2>/dev/null || echo "")

      echo "Previous SHA : ${PREV_SHA}"

      files=""

      if [ -n "${PREV_SHA}" ]; then

        echo "Checking previous commit..."

        if git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then

          echo "Previous commit found"

          files=$(git diff --name-only "${PREV_SHA}" "${CURR_SHA}" || true)

        else

          echo "Previous commit not present locally"
          echo "Using files from current commit"

          files=$(git show --name-only --pretty="" HEAD)

        fi

      else

        echo "No previous build found"

        files=$(git show --name-only --pretty="" HEAD)

      fi

      echo "================================"
      echo "Changed Files"
      echo "================================"
      echo "${files}"

      if [ -z "${files}" ]; then
        echo "No changed files detected."
        exit 0
      fi

      echo "${files}" > "${ARTIFACT_DIR}/changed_files.txt"

      echo "Saving current SHA..."
      echo "${CURR_SHA}" > /tmp/last_commit.txt

      gsutil cp /tmp/last_commit.txt \
        gs://gcpcicd-bucket02/state/last_commit.txt

      echo "Build step completed successfully."
